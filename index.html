<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notes App</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .note { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .note button { margin-left: 10px; }
    form { margin-bottom: 20px; }
    input, textarea { display: block; margin: 5px 0 10px; width: 300px; padding: 8px; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <h1>Notes</h1>

  <form id="note-form">
    <h3 id="form-title">Add New Note</h3>
    <input type="text" id="title" placeholder="Title" required />
    <textarea id="description" placeholder="Description" rows="4" required></textarea>
    <input type="hidden" id="note-id" />
    <button type="submit">Save Note</button>
  </form>

  <div id="notes-container">Loading notes...</div>

  <script>
    const apiUrl = 'http://localhost:8080/note';

    async function fetchNotes() {
      try {
        const response = await fetch(apiUrl);
        const notes = await response.json();
        const container = document.getElementById('notes-container');
        container.innerHTML = '';

        if (notes.length === 0) {
          container.textContent = 'No notes available.';
          return;
        }

        notes.forEach(note => {
          const div = document.createElement('div');
          div.className = 'note';
          div.innerHTML = `
            <strong>${note.title}</strong><br>
            ${note.description}
            <br>
            <button onclick="editNote(${note.id}, '${note.title}', '${note.description}')">Edit</button>
            <button onclick="deleteNote(${note.id})">Delete</button>
          `;
          container.appendChild(div);
        });
      } catch (error) {
        document.getElementById('notes-container').textContent = 'Error loading notes.';
        console.error(error);
      }
    }

    async function addOrUpdateNote(event) {
      event.preventDefault();
      const id = document.getElementById('note-id').value;
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const method = id ? 'PUT' : 'POST';
      const endpoint = id ? `${apiUrl}/${id}` : apiUrl;

      try {
        const response = await fetch(endpoint, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description })
        });

        if (!response.ok) throw new Error('Failed to save note');

        document.getElementById('note-form').reset();
        document.getElementById('form-title').textContent = 'Add New Note';
        fetchNotes();
      } catch (error) {
        alert('Error saving note');
        console.error(error);
      }
    }

    async function deleteNote(id) {
      if (!confirm('Are you sure you want to delete this note?')) return;

      try {
        const response = await fetch(`${apiUrl}/${id}`, {
          method: 'DELETE'
        });

        if (!response.ok) throw new Error('Delete failed');

        fetchNotes();
      } catch (error) {
        alert('Error deleting note');
        console.error(error);
      }
    }

    function editNote(id, title, description) {
      document.getElementById('title').value = title;
      document.getElementById('description').value = description;
      document.getElementById('note-id').value = id;
      document.getElementById('form-title').textContent = 'Edit Note';
    }

    document.getElementById('note-form').addEventListener('submit', addOrUpdateNote);
    fetchNotes();
  </script>
</body>
</html>
